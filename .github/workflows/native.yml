name: Native editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install conan==2.20.1 cmake==3.31.6 ninja==1.11.1.4
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          cache: true
      - name: Resolve locked core dependencies
        run: |
          conan profile detect
          conan install . --lockfile=conan.lock --output-folder=build/dependencies --build=missing -s compiler.cppstd=20 -s build_type=Release
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/build/dependencies/build/Release/generators/conan_toolchain.cmake"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE="$PWD/build/dependencies/build/generators/conan_toolchain.cmake"
      - name: Build
        run: cmake --build build/ci --config Release --parallel 3
      - name: Test domain, storage and rendering
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Test native mouse and synthetic pen workflow
        if: runner.os == 'macOS'
        run: build/ci/open-toon.app/Contents/MacOS/open-toon --smoke-test
      - name: Verify documentation
        run: python scripts/validate_docs.py
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install conan==2.20.1 cmake==3.31.6 ninja==1.11.1.4
      - run: |
          conan profile detect
          conan install . --lockfile=conan.lock --output-folder=build/dependencies --build=missing -s compiler.cppstd=20 -s build_type=Debug
          cmake -S . -B build/sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOPENTOON_DESKTOP=OFF -DOPENTOON_SANITIZERS=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/build/dependencies/build/Debug/generators/conan_toolchain.cmake"
          cmake --build build/sanitized --parallel 3
          ctest --test-dir build/sanitized --output-on-failure
