name: Linux distributable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.2.0-experimental.11

permissions:
  contents: write

jobs:
  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install conan==2.20.1 cmake==3.31.6 ninja==1.11.1.4
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          cache: true
      - name: Resolve locked dependencies
        run: |
          conan profile detect
          conan install . --lockfile=conan.lock --output-folder=build/dependencies --build=missing -s compiler.cppstd=20 -s build_type=Release
      - name: Configure and build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/build/dependencies/build/Release/generators/conan_toolchain.cmake"
          cmake --build build/release --parallel 3
      - name: Verify
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build/release --output-on-failure
          python scripts/validate_docs.py
      - name: Bundle AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl --fail --location --output linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --output linuxdeploy-plugin-qt.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/doc/open-toon
          cp build/release/open-toon AppDir/usr/bin/open-toon
          cp assets/linux/org.opentoon.editor.desktop AppDir/usr/share/applications/
          cp assets/branding/open-toon-logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/org.opentoon.editor.svg
          cp LICENSE AppDir/usr/share/doc/open-toon/LICENSE
          cp docs/implementation/DEPENDENCIES.md AppDir/usr/share/doc/open-toon/DEPENDENCIES.md
          QMAKE="$QT_ROOT_DIR/bin/qmake" ./linuxdeploy.AppImage --appimage-extract-and-run --appdir AppDir --desktop-file assets/linux/org.opentoon.editor.desktop --icon-file assets/branding/open-toon-logo.svg --plugin qt --output appimage
          mv OPEN-TOON-*.AppImage "OPEN-TOON-${VERSION}-Linux-x86_64.AppImage"
          sha256sum "OPEN-TOON-${VERSION}-Linux-x86_64.AppImage" > "OPEN-TOON-${VERSION}-Linux-x86_64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-distributable
          path: |
            OPEN-TOON-${{ inputs.version }}-Linux-x86_64.AppImage
            OPEN-TOON-${{ inputs.version }}-Linux-x86_64.sha256
          if-no-files-found: error

  publish-release:
    needs: package-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-distributable
          path: dist
      - name: Publish release from main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OPEN-TOON ${VERSION}" --notes "Experimental source snapshot with a verified Ubuntu 24.04 x86_64 AppImage. macOS is added after local package verification. This is not a supported 1.0 release; see the implementation status for limitations."
